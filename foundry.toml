[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true

remappings = [
    "@openzeppelin/contracts@5.3.0/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@chainlink/contracts-ccip/contracts/=lib/chainlink-ccip/chains/evm/contracts/",
    "@chainlink/contracts/=lib/chainlink-evm/contracts/"
]

[rpc_endpoints]
sepolia-eth = "${SEPOLIA_RPC_URL}"
arb-sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"



# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
